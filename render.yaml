# Render Blueprint for the Credence AI backend.
#
# No database is used. Prediction history is kept in memory while the service
# runs and is cleared on every restart / redeploy / free-plan sleep. Run a
# single uvicorn process so all requests share the same history.
services:
  - type: web
    name: credence-ai-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: APP_ENV
        value: production
      - key: MAX_STORED_PREDICTIONS
        value: "10000"
